name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show && rustup component add llvm-tools
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (pedantic + nursery)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke (v0.1 done criteria)
        run: cargo run -q -p mud-server --bin mud -- smoke
      - name: world pack check (scripts compiled and dry-run)
        run: cargo run -q -p mud-server --bin mud -- check worlds/crypt-v01
      - name: script cost bounds (release)
        run: cargo test --release -p mud-script --test cost
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage (85% line floor)
        run: cargo llvm-cov --workspace --fail-under-lines 85 --summary-only

  verus:
    name: verus proofs
    runs-on: ubuntu-latest
    env:
      VERUS_RELEASE: 0.2026.10.04.426d8b0
      VERUS_SHA256: 624018662868563a7bec0dd07be5e4dd0c3d61124b4b55105765884bf2d4d1a0
    steps:
      - uses: actions/checkout@v4
      - name: Download the pinned Verus release
        run: |
          curl -fsSL --retry 3 -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
          echo "${VERUS_SHA256}  verus.zip" | sha256sum --check
          unzip -q verus.zip
          rustup toolchain install "$(jq -r '.verus.toolchain' verus-x86-linux/version.json | cut -d' ' -f1)" --profile minimal
      - name: Verify
        run: |
          ./verus-x86-linux/verus formal/verus/src/lib.rs --crate-type=lib | tee verus.out
          grep -Eq '^verification results:: [1-9][0-9]* verified, 0 errors$' verus.out
      - name: Mirror tests (Rust and Verus bodies match)
        run: cargo test -p mud-rules -p mud-supervisor -p mud-server -p mud-accounts --test verus_mirror

  littleguy:
    name: real littleguy end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: autumn-foundation/littleguy
          # The commit whose protocol and config this repository is tested
          # against; bump it on purpose, with the real-lg tests. It is
          # littleguy #122: `overlay_activate` takes the pointer the
          # Steward read (`expected`), and `overlays` names its `head`.
          ref: c507731f7a8930444931c60169931d657cecec73
          path: littleguy
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            littleguy -> target
      # The features the MUD uses. `refine` lets the Steward run lg's
      # proposer and own the overlays (ADR 0015). The rest stay out:
      # `skills` and `council` wait for an owner the MUD never is (skill
      # drafts; lg's council never votes on a tainted proposal), and
      # `followups`, `sandbox`, `auto-approve`, `scripts` and `research`
      # would give an agent tools or approvals outside the game.
      - name: Build lg (the features the MUD uses)
        working-directory: littleguy
        run: cargo build --release -p littleguy --no-default-features --features "claude,openai,mcp,plans,heartbeat,reflection,notes,compaction,refine"
      - name: lg serve accepts the generated config and plays over MCP
        env:
          LG_BIN: ${{ github.workspace }}/littleguy/target/release/lg
        run: |
          cargo test -p mud-supervisor --lib littleguy::
          cargo test -p mud-server --test littleguy_e2e --test shutdown
