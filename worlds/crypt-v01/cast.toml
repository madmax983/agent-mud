# ---------------------------------------------------------------- mobs
# The balance these mobs hold, against the player template, is a test:
# crates/mud-world/src/engine/balance_tests.rs plays seeded duels through
# the engine and fails when a row leaves its band. A fresh player beats
# one rat about three times in four, often wounded, and both rats in one
# run about two times in five (more with a bandage between). The warden is
# a group fight: a fresh player almost never wins alone, and with a
# shortsword and a jerkin one, two and three players win about 30%, 70%
# and 90%. A broadsword does a little better. A respawned warden fights
# the same. The root cellar's pups (below) are easier than one rat, and
# the drift's crawler is about an even fight for a fresh player.
# design-v0.1 section 7 lists the targets. Run the ignored
# `balance_table` test after an edit here: it checks them.
#
# The balance holds for a world made under this file. A saved world keeps
# the attrs and skills its mobs and players had when it was saved, because
# reconcile copies only new gear and `respawn_minutes` into it. A world
# saved before the balance step keeps brawling-12 rats and a
# broadsword-12, HT-12 warden, and its players have no broadsword skill,
# so the fights there are much harder (the "saved" rows of the test
# measure them). Start a fresh world to get this balance.
[cast.giant_rat_1]
name = "giant rat"
aliases = ["rat"]
short = "A giant rat, mangy and dog-sized, hisses at you."
description = "Patchy fur, yellow teeth, and far too much confidence."
kind = "mob"
room = "wine_vault"
attrs = { st = 6, dx = 12, iq = 3, ht = 11 }
skills = { brawling = 11 }
inventory = ["rat_teeth"]
equip = ["rat_teeth"]
hostile = true
respawn_minutes = 30
[cast.giant_rat_1.mind]
tier = "mob"

[cast.giant_rat_2]
