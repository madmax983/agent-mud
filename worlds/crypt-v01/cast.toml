# The cast of crypt-v01: entities, their minds, and the trait library.
#
# `mind.tier` is one of:
#   none        a human player slot or a plain object
#   mob         deterministic; the server runs it
#   ambient     a light NPC on autumn-plugin-agent
#   persistent  a durable littleguy agent
#   turing      a hidden agent PC on littleguy
#
# `script` rules drive the deterministic mind (tests, the smoke run, and
# the fallback when a budget is spent or no model is configured). Each rule
# fires on one trigger and runs its commands through the same parser as a
# human. `{actor}` is the name of the entity that caused the trigger.
#
# A mob with `respawn_minutes` comes back that many minutes after it dies.
# It drops its non-hidden gear where it fell, as loot, and comes back with
# its `inventory` and `equip` made new (ADR 0012). `respawn_kit = false`
# keeps its gear one-off; unset means yes, and only such a mob may set it.

# ------------------------------------------------------- trait library
# A trait with `control` rolls 3d6 against it when a trigger reaches the
# entity's room. A failure sends the entity a private nudge with `cue`.
[traits.greedy]
kinds = ["item_drop", "give", "trade", "loot"]
keywords = ["silver", "coin", "pouch", "loot", "gold", "pay", "split"]
cue = "You failed your Greedy ({target}-) roll at {trigger}. You strongly want a cut, or a way to pocket it."

[traits.cowardly]
kinds = ["combat", "death"]
keywords = ["crypt", "skeleton", "warden", "fight", "kill"]
cue = "You failed your Cowardice ({target}-) roll at {trigger}. You want very badly to be somewhere else."

[traits.gossip]
kinds = ["enter", "board_post"]
keywords = ["cellar", "grate", "crypt", "heard", "rumor"]
cue = "You failed your Gossip ({target}-) roll at {trigger}. You cannot keep from passing on what you know."

[traits.stubborn]
kinds = ["haggle"]
keywords = ["cheaper", "discount", "lower", "deal", "less"]
cue = "You failed your Stubbornness ({target}-) roll at {trigger}. You will not budge on this."

[traits.honest]
kinds = ["theft"]
keywords = ["steal", "lie", "cheat", "fence", "stolen"]
cue = "You failed your Honesty ({target}-) roll at {trigger}. You cannot let a crooked thing pass without saying so."

[traits.duty]
kinds = ["combat", "guard_intervene"]
keywords = ["alley", "grate", "trouble", "help", "guard"]
cue = "You failed your Sense of Duty ({target}-) roll at {trigger}. You must step in."

[traits.curious]
kinds = ["board_post", "item_drop"]
keywords = ["cellar", "lantern", "ore", "crypt", "lockbox", "secret", "key"]
cue = "You failed your Curiosity ({target}-) roll at {trigger}. You need to know more, right now."

[traits.impatient]
kinds = ["speech"]
keywords = ["wait", "later", "hold on", "brb", "sec", "tomorrow"]
cue = "You failed your Impatience ({target}-) roll at {trigger}. You hate waiting. Push to go now."

[traits.pacifist_self_defense]
# No roll: a server rule. The entity cannot start a fight.
policy = "no_first_strike"

[traits.blunt]

