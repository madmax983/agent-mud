room = "smithy"
attrs = { st = 13, dx = 11, iq = 10, ht = 12 }
skills = { smith = 14, merchant = 12, broadsword = 11 }
traits = [{ name = "stubborn", control = 12 }, { name = "honest", control = 12 }]
