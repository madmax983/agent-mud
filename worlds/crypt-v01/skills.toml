# Skills of crypt-v01. Each skill names its controlling attribute and its
# difficulty. An untrained entity rolls the default: attribute -4 (easy),
# -5 (average) or -6 (hard). `combat` marks a weapon skill that can parry.
# `effect` names an engine effect of a success: `pick_lock` opens a lock
# (the lock sets the modifier), `hide` hides the actor, `haggle` takes 10%
# off the next purchase from the target keeper. Any other skill rolls and
# reports the result to the room; the minds decide what it means.
[skills.shortsword]
name = "Shortsword"
attr = "dx"
difficulty = "average"
combat = true

