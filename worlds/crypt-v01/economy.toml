# The currency and the shops of crypt-v01.
[currency]
name = "silver"
short = "s"

# A shop belongs to an entity of cast.toml. `stock` items are merchandise:
# they leave the shop only through a sale (POLICY_TRADE_REQUIRED).
# `fixture` names the fixed container (items.toml) that holds the stock in
# the shop room (`room`, by default the keeper's starting room). The stock
# stays there whoever walks off, and it sells while the keeper can act in
# that room. `unattended = true` makes it an honesty box that sells with
# nobody minding it. A shop with no fixture keeps its stock on the
# keeper's body.
# `buys` lists the tags or item ids the keeper buys, at `buy_rate` of the
# value. `prices` overrides the buying price of one item.
[shops.marta]
keeper = "marta"
fixture = "flagon_shelf"
stock = ["ale", "ale", "ale", "ale", "ale", "torch", "torch", "healing_draught"]
buys = ["loot"]
buy_rate = 0.4
sell_markup = 1.0

[shops.torin]
keeper = "torin"
fixture = "smithy_rack"
stock = ["broadsword", "shortsword", "dagger", "leather_jerkin", "lantern", "spear"]
buys = ["iron_ore"]
buy_rate = 0.5
sell_markup = 1.0
prices = { iron_ore = 15 }

[shops.vich]
keeper = "vich"
fixture = "fence_crate"
stock = ["grate_key", "bandage", "bandage", "torch"]
buys = ["loot", "ore"]
buy_rate = 0.6
sell_markup = 1.0

# Reward pools (ADR 0010, docs/scripting.md). A world script may mint
# money and items as a quest reward only from a pool, and never past what
# is left of its budget for the period: `per = "day"` refills every UTC day
# of the game clock, `per = "ever"` never. Every mint is in the ledger.
#
# Hale pays the watch's bounty to whoever brings back the skeletal
# warden's notched grave-blade while the ossuary is quiet
# (scripts/rooms/square.rhai, `report`). Three bounties a day.
[rewards.warden_bounty]
currency = 60
items = { healing_draught = 3 }
per = "day"
