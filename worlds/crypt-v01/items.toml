# The cheap blade between the dagger and a sword. It swings like a
# shortsword with the Axe/Mace skill, which the template has one level
# lower than Shortsword. So it does about as well as the dagger against a
# rat, and better against the warden's bone and the crawler's chitin
# (balance_tests.rs checks all three).
[items.hatchet]
name = "hatchet"
aliases = ["axe", "hand axe"]
description = "A short-hafted hatchet with a bearded head, more tool than weapon, and sharp all the same."
value = 20
slot = "weapon"
skill = "axe"
damage = "sw"
damage_type = "cut"

