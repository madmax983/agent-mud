[workspace]
resolver = "3"
members = [
    "crates/mud-rules",
    "crates/mud-world",
    # "crates/mud-mcp",
    # "crates/mud-supervisor",
    # "crates/mud-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
repository = "https://github.com/madmax983/agent-mud"

[workspace.dependencies]
mud-rules = { version = "0.1.0", path = "crates/mud-rules" }
mud-world = { version = "0.1.0", path = "crates/mud-world" }
mud-mcp = { version = "0.1.0", path = "crates/mud-mcp" }
mud-supervisor = { version = "0.1.0", path = "crates/mud-supervisor" }
anyhow = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "process"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
