[package]
name = "mud-server"
description = "The littleguy MUD server: an autumn-web terminal, telnet, the MCP endpoint, the observer dashboard and the supervisor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mud"
path = "src/main.rs"

[dependencies]
mud-world.workspace = true
mud-mcp.workspace = true
mud-supervisor.workspace = true
autumn-web = { version = "0.11.0", default-features = false, features = ["maud", "htmx", "ws"] }
autumn-harvest-agent = { version = "0.11.0", features = ["sqlite", "openai"] }
autumn-plugin-agent = "0.5"
maud = "0.27"
anyhow.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.28"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
